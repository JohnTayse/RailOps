<div class="modal fade" id="addLocomotiveModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<h1 class="modal-title fs-5" id="addLocomotiveModalLabel">Add Locomotive</h1>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<div id="addLocomotiveForm">
					<div>
						<label for="reportingMarkInput" class="form-label text-start">Reporting Mark</label>
						<input type="text" class="form-control displayNamePart" id="reportingMarkInput" placeholder="CSXT">

						<label for="roadNumberInput" class="form-label text-start">Road Number</label>
						<input type="text" class="form-control displayNamePart" id="roadNumberInput" placeholder="1234">

						<label for="displayName" class="form-label text-start">Display Name</label>
						<input type="text" class="form-control" id="displayName" placeholder="CSXT1234" disabled>
						
						<label for="typeSelect" class="form-label text-start">Type</label>
						<select id="typeSelect" class="form-select" aria-label="Type Select">
							<option selected>&mdash;</option>
						</select>

						<label for="scaleInput" class="form-label text-start">Scale</label>
						<input type="text" class="form-control" id="scaleInput" placeholder="HO">

						<label for="color1Input" class="form-label text-start">Color 1</label>
						<input type="color" class="form-control" id="color1Input" value="#ffffff">

						<label for="color2Input" class="form-label text-start">Color 2</label>
						<input type="color" class="form-control" id="color2Input" value="#000000">

						<label for="notesText" class="form-label text-start">Notes</label>
						<textarea type="textarea" class="form-control" id="notesText" placeholder="Enter any locomotive notes" rows="3"></textarea>

						<label for="pictureInput" class="form-label text-start">Picture</label>
						<input type="file" class="form-control" id="pictureInput" accept="image/*">
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" id="clearButton">Clear</button>
				<button type="button" class="btn btn-primary" id="addButton">Add</button>
			</div>
		</div>
	</div>
</div>
