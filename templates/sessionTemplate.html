<div id="session">
    <h1 id="sessionTitle">Session</h1>
    <button id="homeButton" class="btn btn-secondary">Home</button>
    <br />
    <div id="sessionContent" class="text-start"></div>
    <div id="sessionSetouts">
        <h2 class="text-start">Setouts</h2>
        <div class="table-responsive text-start">
            <table class="table">
                <thead>
                    <tr>
                        <th>Stock</th>
                        <th>Location</th>
                    </tr>
                </thead>
                <tbody id="sessionSetoutsBody">
                </tbody>
            </table>
        </div>
    </div>
    <div id="sessionSwitches">
        <h2 class="text-start" id="sessionSwitchesTitle">Switches</h2>
        <div class="table-responsive text-start">
            <table class="table">
                <thead>
                    <tr>
                        <th>Stock</th>
                        <th>Location</th>
                    </tr>
                </thead>
                <tbody id="sessionSwitchesBody">
                </tbody>
            </table>
        </div>
    </div>
    <button id="lastButton" class="btn btn-secondary">Last Switch List</button>
    <button id="nextButton" class="btn btn-primary">Next Switch List</button>
</div>
